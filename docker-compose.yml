version: '3.8'

services:
  soroban:
    image: stellar/quickstart:latest
    ports:
      - "8000:8000"
      - "11626:11626"
      - "11625:11625"
    environment:
      - NETWORK=standalone
      - HORIZON_PORT=8000
      - CORE_PORT=11626
    volumes:
      - soroban_data:/var/lib/stellar
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - SOROBAN_RPC_URL=http://soroban:8000/soroban/rpc
      - HORIZON_API_URL=http://soroban:8000
      - INVOICE_CONTRACT_ID=${INVOICE_CONTRACT_ID:-CONTRACT_ID_PLACEHOLDER}
      - REDIS_URL=redis://redis:6379
    depends_on:
      soroban:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/rpc"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - backend_data:/app/data

volumes:
  soroban_data:
  redis_data:
  mongodb_data:
  backend_data:
