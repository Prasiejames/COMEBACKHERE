<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Status Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="container">
    <header>
      <h1>Invoice Status Dashboard</h1>
      <div class="controls" role="search" aria-label="Filter invoices">
        <label for="search" class="sr-only">Search invoices</label>
        <input type="text" id="search" placeholder="Search by ID, merchant, or customer...">
        <label for="statusFilter" class="sr-only">Filter by status</label>
        <select id="statusFilter">
          <option value="">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Paid">Paid</option>
          <option value="Expired">Expired</option>
          <option value="Cancelled">Cancelled</option>
          <option value="RefundRequested">Refund Requested</option>
          <option value="Released">Released</option>
        </select>
        <button id="refreshBtn">Refresh</button>
      </div>
    </header>

    <div class="summary" id="summary"></div>

    <div class="table-wrapper">
      <table id="invoiceTable" aria-label="Invoice list">
        <thead>
          <tr>
            <th scope="col" data-sort="id" aria-sort="ascending">ID</th>
            <th scope="col" data-sort="merchant">Merchant</th>
            <th scope="col" data-sort="customer">Customer</th>
            <th scope="col" data-sort="amount">Amount</th>
            <th scope="col" data-sort="status">Status</th>
            <th scope="col" data-sort="created_at">Created</th>
            <th scope="col" data-sort="expires_at">Expires</th>
          </tr>
        </thead>
        <tbody id="invoiceBody"></tbody>
      </table>
    </div>
    <div id="main-content"></div>

    <div class="legend">
      <h3>Status Legend</h3>
      <div class="legend-items">
        <span class="badge badge-pending">Pending</span>
        <span class="badge badge-paid">Paid</span>
        <span class="badge badge-expired">Expired</span>
        <span class="badge badge-cancelled">Cancelled</span>
        <span class="badge badge-refund">Refund Requested</span>
        <span class="badge badge-released">Released</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Update aria-sort attributes after each render
    const origRender = render;
    render = function() {
      origRender();
      updateAriaSort();
    };
    function updateAriaSort() {
      document.querySelectorAll('thead th[data-sort]').forEach(th => {
        const field = th.dataset.sort;
        if (field === sortField) {
          th.setAttribute('aria-sort', sortAsc ? 'ascending' : 'descending');
        } else {
          th.removeAttribute('aria-sort');
        }
      });
    }
  </script>
</body>
</html>
